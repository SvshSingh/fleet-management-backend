# Single-node broker for local evaluation.
# Anonymous access is deliberate: this compose stack is a closed network with no
# ports exposed to the internet. See SYSTEM_DESIGN.md for what changes in production.
listener 1883
allow_anonymous true

# Persist retained messages and QoS-1 queues across broker restarts so a robot's
# last known telemetry survives a broker bounce.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Queue for disconnected persistent sessions (backend uses clean_session=false).
max_queued_messages 10000

log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
